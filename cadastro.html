<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NF&M - Cadastro de paciente</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <h1>nf&m</h1>
        </div>

        <button id="btnTema" class="btn-tema" type="button">
            Tema escuro
        </button>

        <nav class="menu">
            <a href="index.html">Início</a>

            <a href="cadastro.html" class="ativo">
                Cadastrar paciente
            </a>

            <a href="pacientes.html">
                Pacientes
            </a>

            <button id="btnSair" class="btn-sair" type="button">
                Sair
            </button>
        </nav>

    </header>

    <main>

        <section class="pagina">

            <div class="pagina-cabecalho">
                <h2>Cadastrar paciente</h2>
                <p>Preencha as informações do paciente.</p>
            </div>

            <form id="formCadastro" class="formulario">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome completo"
                        required
                    >
                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input
                            type="text"
                            id="cpf"
                            placeholder="000.000.000-00"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="nascimento">Data de nascimento</label>
                        <input
                            type="date"
                            id="nascimento"
                            required
                        >
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="sexo">Sexo</label>
                        <select id="sexo" required>
                            <option value="">Selecione</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="sangue">Tipo sanguíneo</label>
                        <select id="sangue" required>
                            <option value="">Selecione</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="altura">Altura (cm)</label>
                        <input
                            type="number"
                            id="altura"
                            placeholder="Ex.: 175"
                            min="1"
                        >
                    </div>

                    <div class="campo">
                        <label for="peso">Peso (kg)</label>
                        <input
                            type="number"
                            id="peso"
                            placeholder="Ex.: 70"
                            min="1"
                            step="0.1"
                        >
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="nomeMae">Nome da mãe</label>
                        <input
                            type="text"
                            id="nomeMae"
                            placeholder="Nome completo"
                        >
                    </div>

                    <div class="campo">
                        <label for="nomePai">Nome do pai</label>
                        <input
                            type="text"
                            id="nomePai"
                            placeholder="Nome completo"
                        >
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input
                            type="tel"
                            id="telefone"
                            placeholder="(00) 00000-0000"
                        >
                    </div>

                    <div class="campo">
                        <label for="endereco">Endereço</label>
                        <input
                            type="text"
                            id="endereco"
                            placeholder="Digite o endereço"
                        >
                    </div>

                </div>

                <div class="campo">
                    <label for="alergias">Alergias</label>
                    <textarea
                        id="alergias"
                        rows="3"
                        placeholder="Informe alergias conhecidas"
                    ></textarea>
                </div>

                <div class="campo">
                    <label for="medicamentosUso">
                        Medicamentos de uso habitual
                    </label>

                    <textarea
                        id="medicamentosUso"
                        rows="5"
                        placeholder="Medicamento, dosagem, frequência e outras informações"
                    ></textarea>
                </div>

                <div class="campo">
                    <label for="medicamentosAdministrados">
                        Medicamentos a serem administrados
                    </label>

                    <textarea
                        id="medicamentosAdministrados"
                        rows="5"
                        placeholder="Medicamento, dosagem, horário, via e observações"
                    ></textarea>
                </div>

                <div class="campo">
                    <label for="observacoes">Observações gerais</label>

                    <textarea
                        id="observacoes"
                        rows="5"
                        placeholder="Outras informações importantes"
                    ></textarea>
                </div>

                <button type="submit" class="botao">
                    Cadastrar paciente
                </button>

            </form>

        </section>

    </main>

    <footer class="footer">
        <p>NF&M - Sistema de Enfermagem</p>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cadastro.js"></script>

</body>

</html>
