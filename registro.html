<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NF&M - Criar conta</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="tela-login">
    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                <h1>nf&m</h1>
                <p>Sistema de Enfermagem</p>
            </div>

            <div class="login-titulo">
                <h2>Criar conta</h2>
                <p>Cadastre seus dados para acessar o sistema.</p>
            </div>

            <form id="formRegistro" class="login-form">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="botao login-botao">
                    Criar conta
                </button>

            </form>

            <div class="login-registro">
                <p>
                    Já possui uma conta?
                    <a href="login.html">Entrar</a>
                </p>
            </div>

        </section>

    </main>

    <button id="btnTema" class="btn-tema login-tema" type="button">
        Tema escuro
    </button>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="js/main.js"></script>
    <script src="js/registro.js"></script>

</body>

</html>
